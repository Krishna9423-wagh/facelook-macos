<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="960" height="480" fill="url(#bg)" rx="12" />

  <!-- Title -->
  <text x="480" y="42" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="-0.5">FaceLook System Architecture</text>
  <text x="480" y="64" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">End-to-End macOS Biometric FaceID &amp; Wake Automation Pipeline</text>

  <!-- Step 1: Camera Capture -->
  <g transform="translate(40, 100)" filter="url(#boxShadow)">
    <rect width="250" height="150" rx="10" fill="url(#boxGrad1)" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="28" cy="28" r="14" fill="#0284c7" fill-opacity="0.2" />
    <text x="28" y="32" font-family="sans-serif" font-size="14" text-anchor="middle">📷</text>
    <text x="52" y="32" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">1. AVFoundation</text>
    <text x="20" y="65" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">● CameraManager service</text>
    <text x="20" y="85" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">● Dedicated serial background queue</text>
    <text x="20" y="105" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">● 32-bit BGRA @ 30 FPS stream</text>
    <text x="20" y="125" font-family="SF Mono, monospace" font-size="10" fill="#38bdf8">AsyncStream&lt;CMSampleBuffer&gt;</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <path d="M 290 175 L 350 175" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" fill="none" />
  <polygon points="350, 175 342, 170 342, 180" fill="#38bdf8" />

  <!-- Step 2: Vision Tracking -->
  <g transform="translate(355, 100)" filter="url(#boxShadow)">
    <rect width="250" height="150" rx="10" fill="url(#boxGrad1)" stroke="#818cf8" stroke-width="1.5" />
    <circle cx="28" cy="28" r="14" fill="#4f46e5" fill-opacity="0.2" />
    <text x="28" y="32" font-family="sans-serif" font-size="14" text-anchor="middle">🧠</text>
    <text x="52" y="32" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#a5b4fc">2. Apple Vision</text>
    <text x="20" y="65" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">● VNDetectFaceRectanglesRequest</text>
    <text x="20" y="85" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">● VNDetectFaceLandmarksRequest</text>
    <text x="20" y="105" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">● Anti-spoofing blink calculation (EAR)</text>
    <text x="20" y="125" font-family="SF Mono, monospace" font-size="10" fill="#a5b4fc">Normalized Face Crop &amp; Mesh</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <path d="M 605 175 L 665 175" stroke="#818cf8" stroke-width="2" stroke-dasharray="4,4" fill="none" />
  <polygon points="665, 175 657, 170 657, 180" fill="#818cf8" />

  <!-- Step 3: Biometrics & Vector Match -->
  <g transform="translate(670, 100)" filter="url(#boxShadow)">
    <rect width="250" height="150" rx="10" fill="url(#boxGrad1)" stroke="#10b981" stroke-width="1.5" />
    <circle cx="28" cy="28" r="14" fill="#059669" fill-opacity="0.2" />
    <text x="28" y="32" font-family="sans-serif" font-size="14" text-anchor="middle">⚡️</text>
    <text x="52" y="32" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#34d399">3. Accelerate vDSP</text>
    <text x="20" y="65" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">● VNGenerateImageFeaturePrint</text>
    <text x="20" y="85" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">● 512D unit-normalized embedding</text>
    <text x="20" y="105" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">● vDSP_dotpr cosine similarity</text>
    <text x="20" y="125" font-family="SF Mono, monospace" font-size="10" fill="#34d399">Match Threshold &ge; 65%</text>
  </g>

  <!-- Lower Row Flow -->
  <!-- Step 4: Keychain Storage -->
  <g transform="translate(190, 290)" filter="url(#boxShadow)">
    <rect width="260" height="140" rx="10" fill="url(#boxGrad1)" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="28" cy="28" r="14" fill="#d97706" fill-opacity="0.2" />
    <text x="28" y="32" font-family="sans-serif" font-size="14" text-anchor="middle">🔐</text>
    <text x="52" y="32" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#fbbf24">macOS Keychain</text>
    <text x="20" y="65" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">● kSecClassGenericPassword</text>
    <text x="20" y="85" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">● FirstUnlockThisDeviceOnly</text>
    <text x="20" y="105" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">● Multi-sample average baseline</text>
  </g>

  <!-- Step 5: Screen Wake & Script Trigger -->
  <g transform="translate(510, 290)" filter="url(#boxShadow)">
    <rect width="260" height="140" rx="10" fill="url(#boxGrad1)" stroke="#ec4899" stroke-width="1.5" />
    <circle cx="28" cy="28" r="14" fill="#db2777" fill-opacity="0.2" />
    <text x="28" y="32" font-family="sans-serif" font-size="14" text-anchor="middle">🚀</text>
    <text x="52" y="32" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#f472b6">Screen Wake Trigger</text>
    <text x="20" y="65" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">● NSWorkspace.screensDidWake</text>
    <text x="20" y="85" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">● unlock_action.sh executor</text>
    <text x="20" y="105" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">● AppleScript lock dismissal</text>
  </g>

  <!-- Vertical & Diagonal Interconnects -->
  <path d="M 795 250 L 795 360 L 770 360" stroke="#10b981" stroke-width="2" fill="none" stroke-dasharray="4,4" />
  <polygon points="770, 360 778, 355 778, 365" fill="#10b981" />

  <path d="M 450 360 L 510 360" stroke="#f59e0b" stroke-width="2" fill="none" stroke-dasharray="4,4" />
  <polygon points="510, 360 502, 355 502, 365" fill="#f59e0b" />
</svg>
