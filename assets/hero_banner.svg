<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Glassmorphic Gradients -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.4" />
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="520" fill="url(#bgGrad)" />

  <!-- Ambient Glow Spheres -->
  <circle cx="280" cy="180" r="320" fill="url(#cyanGlow)" />
  <circle cx="920" cy="280" r="360" fill="url(#greenGlow)" />

  <!-- Grid overlay -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="160" y1="0" x2="160" y2="520" />
    <line x1="320" y1="0" x2="320" y2="520" />
    <line x1="480" y1="0" x2="480" y2="520" />
    <line x1="640" y1="0" x2="640" y2="520" />
    <line x1="800" y1="0" x2="800" y2="520" />
    <line x1="960" y1="0" x2="960" y2="520" />
    <line x1="1120" y1="0" x2="1120" y2="520" />
  </g>

  <!-- LEFT HERO SECTION -->
  <g transform="translate(80, 80)">
    <!-- Menu Bar Badge -->
    <g transform="translate(0, 0)">
      <rect width="210" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="15" r="5" fill="#10b981" filter="url(#glow)" />
      <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">MACOS MENU BAR AGENT</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="56" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1.5">FaceLook</text>

    <!-- Subtitle -->
    <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="20" font-weight="600" fill="#f8fafc" letter-spacing="-0.3">MacID Biometric Facial Authentication</text>

    <!-- Description -->
    <text x="0" y="165" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="14" fill="#94a3b8" width="460">
      <tspan x="0" dy="0">High-performance FaceID for macOS built with AVFoundation,</tspan>
      <tspan x="0" dy="22">Apple Vision framework, Accelerate vDSP vector cosine</tspan>
      <tspan x="0" dy="22">similarity, and secure macOS Keychain storage.</tspan>
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 240)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="115" height="32" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
        <text x="14" y="20" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">⚡️ Vision ML</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(125, 0)">
        <rect width="140" height="32" rx="8" fill="#1e293b" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
        <text x="14" y="20" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#34d399">🔐 Keychain Bio</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(275, 0)">
        <rect width="140" height="32" rx="8" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1" />
        <text x="14" y="20" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#a5b4fc">📐 vDSP Cosine</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(0, 42)">
        <rect width="160" height="32" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1" />
        <text x="14" y="20" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#fbbf24">🚀 Wake Auto-Unlock</text>
      </g>
      <!-- Pill 5 -->
      <g transform="translate(170, 42)">
        <rect width="130" height="32" rx="8" fill="#1e293b" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1" />
        <text x="14" y="20" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#f472b6">👁️ Blink Liveness</text>
      </g>
      <!-- Pill 6 -->
      <g transform="translate(310, 42)">
        <rect width="105" height="32" rx="8" fill="#1e293b" stroke="#64748b" stroke-opacity="0.4" stroke-width="1" />
        <text x="14" y="20" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Swift 6.0</text>
      </g>
    </g>
  </g>

  <!-- RIGHT MOCKUP: MACOS MENU BAR POPOVER -->
  <g transform="translate(680, 45)" filter="url(#cardShadow)">
    <!-- Popover Card Background -->
    <rect width="440" height="430" rx="16" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.5" />

    <!-- Popover Arrow Tip (top center-ish) -->
    <polygon points="220, -10 210, 0 230, 0" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />

    <!-- Popover Header -->
    <g transform="translate(24, 24)">
      <!-- Lock Icon -->
      <circle cx="16" cy="16" r="16" fill="#10b981" fill-opacity="0.2" />
      <circle cx="16" cy="16" r="6" fill="#10b981" />
      <text x="44" y="15" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">MacID Vision</text>
      <text x="44" y="28" font-family="-apple-system, sans-serif" font-size="10" font-weight="500" fill="#10b981">● Biometric Protection Active</text>

      <rect x="300" y="4" width="90" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <circle cx="314" cy="16" r="4" fill="#ef4444" />
      <text x="325" y="20" font-family="SF Mono, monospace" font-size="10" font-weight="700" fill="#f8fafc">LIVE 30FPS</text>
    </g>

    <line x1="24" y1="70" x2="416" y2="70" stroke="#334155" stroke-opacity="0.5" stroke-width="1" />

    <!-- Camera Viewport Mockup -->
    <g transform="translate(24, 84)">
      <!-- Viewport Frame -->
      <rect width="392" height="180" rx="10" fill="#020617" stroke="#334155" stroke-width="1" />

      <!-- Subdued Camera Face Avatar Silhouette -->
      <g transform="translate(196, 90)" opacity="0.45">
        <circle cx="0" cy="-12" r="38" fill="#1e293b" />
        <path d="M -50 65 Q 0 25 50 65" fill="#1e293b" />
      </g>

      <!-- Vision Biometric Reticle Box -->
      <g transform="translate(136, 32)">
        <!-- Translucent Box Fill -->
        <rect width="120" height="120" rx="8" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />

        <!-- 4 Cyber Corner Brackets -->
        <path d="M 0 16 L 0 0 L 16 0" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#glow)" />
        <path d="M 104 0 L 120 0 L 120 16" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#glow)" />
        <path d="M 120 104 L 120 120 L 104 120" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#glow)" />
        <path d="M 16 120 L 0 120 L 0 104" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#glow)" />

        <!-- Facial Landmark Mesh Points -->
        <circle cx="42" cy="45" r="2.5" fill="#38bdf8" />
        <circle cx="78" cy="45" r="2.5" fill="#38bdf8" />
        <circle cx="60" cy="65" r="2" fill="#38bdf8" />
        <path d="M 45 85 Q 60 92 75 85" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-linecap="round" />
        <path d="M 36 38 Q 44 34 52 38" stroke="#34d399" stroke-width="1.2" fill="none" />
        <path d="M 68 38 Q 76 34 84 38" stroke="#34d399" stroke-width="1.2" fill="none" />

        <!-- Floating Verified Badge -->
        <g transform="translate(10, -14)">
          <rect width="100" height="20" rx="10" fill="#10b981" filter="url(#glow)" />
          <text x="14" y="14" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#000000">✓ VERIFIED 96%</text>
        </g>
      </g>
    </g>

    <!-- Biometric Status Bar Card -->
    <g transform="translate(24, 278)">
      <rect width="392" height="64" rx="10" fill="#0f172a" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />

      <!-- Verified Shield Icon -->
      <circle cx="34" cy="32" r="16" fill="#10b981" fill-opacity="0.18" />
      <path d="M 34 22 L 42 26 L 42 33 C 42 38 34 42 34 42 C 34 42 26 38 26 33 L 26 26 Z" fill="none" stroke="#10b981" stroke-width="1.8" />
      <path d="M 30 32 L 33 35 L 38 29" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />

      <text x="60" y="26" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#34d399">IDENTITY CONFIRMED</text>
      <text x="60" y="42" font-family="-apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Keychain baseline match: 96.4% · Cosine Similarity</text>

      <rect x="330" y="22" width="50" height="20" rx="6" fill="#10b981" fill-opacity="0.2" />
      <text x="339" y="36" font-family="SF Mono, monospace" font-size="10" font-weight="700" fill="#34d399">PASS</text>
    </g>

    <!-- Bottom Action Row -->
    <g transform="translate(24, 356)">
      <rect width="240" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="20" cy="19" r="4" fill="#38bdf8" />
      <text x="34" y="23" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Screen Wake Auto-Unlock: Active</text>

      <!-- Re-enroll Button -->
      <rect x="252" y="0" width="140" height="38" rx="8" fill="#2563eb" />
      <text x="286" y="23" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Re-enroll Face</text>
    </g>

    <!-- Window Footer Details -->
    <g transform="translate(24, 410)">
      <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="9" fill="#64748b">MacID Core v1.0 · Apple Neural Engine Accelerated</text>
    </g>
  </g>
</svg>
